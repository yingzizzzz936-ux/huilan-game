    <h2>名錄</h2>
    <p class="small gray">1998 年回瀾法會．入水七人</p>

    <table class="stack" style="width:100%;border-collapse:collapse;"><tr>
    <td class="col-left" style="width:340px;vertical-align:top;padding:0 14px 0 0;">
    <table class="list">
      <tr><td class="gray" style="width:48px;">一</td><td>林潮生</td><td class="gray">聽潮人／住持</td></tr>
      <tr><td class="gray" style="width:48px;">二</td><td>陳阿蕊</td><td class="gray">信眾</td></tr>
      <tr><td class="gray" style="width:48px;">三</td><td>吳金水</td><td class="gray">信眾</td></tr>
      <tr><td class="gray" style="width:48px;">四</td><td>林美玉</td><td class="gray">信眾</td></tr>
      <tr><td class="gray" style="width:48px;">五</td><td>周秀蘭</td><td class="gray">信眾</td></tr>
      <tr><td class="gray" style="width:48px;">六</td><td>許萬得</td><td class="gray">信眾</td></tr>
      <tr><td class="gray" style="width:48px;">七</td><td><span style="display:inline-block;width:82px;height:15px;background:#0a0908;border:1px solid #2a241d;"></span></td><td class="gray">—</td></tr>
    </table>

    <p class="small gray" style="margin-top:12px;">
      第七個名字被塗死了。透光、翻到背面，都看不出來。<br>
      原件最下方還有一行小字：「第七位：不可問。不可呼。」
    </p>
    </td>
    <td class="col-right" style="width:290px;vertical-align:top;padding:0;">
