  <div class="body">
    <h2>工單系統</h2>
    <p class="small gray">v1.1　僅限內部使用　主機：工作室本機</p>

    <form id="login" style="margin-top:16px;">
      <div class="formrow"><label>工號</label><input type="text" id="u" value=""></div>
      <div class="formrow"><label>口令</label><input type="text" id="p" value=""></div>
      <div class="formrow"><label></label><input type="submit" value="登　入"></div>
    </form>

    <p id="err" class="warn small" style="min-height:18px;"></p>

    <p class="small gray">
      工號：年度（四碼）　——　重建，或法會<br>
      口令：法會日期（月日四碼）
    </p>

    <p class="small gray" style="margin-top:18px;">
      ※ 本系統於 2005/03/11 之後無登入紀錄。
    </p>
<!-- 工號不是員編。是年度。 -->

<script>window.HL_VIEWER="../_v/viewer.html";</script>
<script src="../js/hl-audio.js"></script>
<script src="../js/site.js"></script>
<script>
(function(){
  var f = document.getElementById("login");
  var err = document.getElementById("err");
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var u = document.getElementById("u").value.trim();
    var p = document.getElementById("p").value.trim();
    if ((u === "1997" || u === "1998" || u === "2003") && p === "0807") {
      try { sessionStorage.setItem("hl_sys", "1"); } catch (e2) {}
      location.href = "workorder.html";
    } else {
      err.textContent = "工號或口令錯誤。連續三次錯誤將鎖定本機。";
    }
  });
})();
</script>
