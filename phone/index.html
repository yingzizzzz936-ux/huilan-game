<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>預約專線</title>
<link rel="stylesheet" href="../css/old.css">
<style>
  .phone{width:250px;margin:20px auto;border:2px solid #3a332c;border-radius:8px;background:#241f19;padding:16px;}
  .screen{background:#0a0908;border:1px solid #3a332c;color:#86b295;font-family:"Courier New",monospace;
          font-size:15px;letter-spacing:3px;padding:10px;text-align:center;margin-bottom:14px;height:22px;}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keys button{padding:12px 0;font-size:15px;letter-spacing:0;}
  .recv{margin:16px auto 0;font-size:11px;color:#7d7466;text-align:center;line-height:1.9;}
</style>
</head>
<body data-amb="e06_fluorescent_hum" data-amb-vol="0.22">
<div class="page">
  <div class="head">
    <div class="logo">預約專線</div>
    <div class="sub">02-2xxx-0913 &nbsp;/&nbsp; 回岸音檔修復工作室</div>
  </div>
  <div class="nav"><a href="../index.html">回首頁</a>｜<a href="../service.html">服務項目</a></div>
  <div class="body">

    <p class="small gray" style="text-align:center;">請輸入分機號碼。</p>

    <div class="phone">
      <div class="screen" id="scr">—</div>
      <div class="keys">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="*">＊</button><button data-k="0">0</button><button data-k="#">＃</button>
      </div>
      <div class="recv">
        分機 7　預約<br>
        分機 0　語音信箱
      </div>
    </div>

    <div id="out" class="small" style="text-align:center;min-height:64px;color:#b9b09d;margin-top:16px;"></div>
    <div id="voice" class="small" style="text-align:center;color:#6b6357;min-height:20px;"></div>

  </div>
  <div class="foot">
    Copyright 2004 回岸音檔修復工作室　最後更新 2005/03/11 03:12<br>
    <span style="color:#3f3830;">※ 本網站為虛構創作，人物、地點與事件均屬虛構。</span>
  </div>
</div>

<script src="../js/hl-audio.js"></script>
<script>
(function(){
  var scr = document.getElementById("scr");
  var out = document.getElementById("out");
  var voice = document.getElementById("voice");
  var buf = "";
  var ctx = null;

  function busyTone(cb) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { cb(); return; }
      if (!ctx) ctx = new AC();
      if (ctx.state === "suspended") ctx.resume();
      var t0 = ctx.currentTime;
      for (var i = 0; i < 3; i++) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 410;
        g.gain.setValueAtTime(0.0001, t0 + i * 1.0);
        g.gain.linearRampToValueAtTime(0.22, t0 + i * 1.0 + 0.02);
        g.gain.setValueAtTime(0.22, t0 + i * 1.0 + 0.45);
        g.gain.linearRampToValueAtTime(0.0001, t0 + i * 1.0 + 0.5);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + i * 1.0); o.stop(t0 + i * 1.0 + 0.52);
      }
      setTimeout(cb, 3000);
    } catch(e) { cb(); }
  }

  function reset() {
    buf = ""; scr.textContent = "—"; out.textContent = ""; voice.textContent = "";
  }

  document.querySelectorAll(".keys button").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.getAttribute("data-k");
      if (k === "*" || k === "#") { reset(); return; }
      buf += k;
      scr.textContent = buf;

      if (k === "7") {
        out.innerHTML = "嘟——嘟——嘟——<br><span style='color:#7d7466'>（線路已停用。線路已停用。線路已停——）</span>";
        voice.textContent = "（分機 7，無人接聽）";
        busyTone(function(){
          HL.once("v06_operator", 0.75);
          voice.textContent = "（那段語音，第三次沒有播完。）";
        });
      } else if (k === "0") {
        out.innerHTML = "<span class='gray'>轉接語音信箱……</span>";
        voice.textContent = "（您有一則未聽取的留言）";
        setTimeout(function(){
          HL.once("v02_akizuki_phone", 0.8);
          voice.textContent = "（留言結束。沒有嗶聲。）";
        }, 900);
      } else if (buf.length > 4) {
        out.innerHTML = "<span class='gray'>沒有這個分機。</span>";
        voice.textContent = "";
      }
    });
  });
})();
</script>
</body>
</html>
