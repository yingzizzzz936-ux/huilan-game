    <h2>2005/02/22　她帶來的帶子</h2>
    <p>底噪裡有一個人的呼吸。</p>
    <p>我數過，一分鐘 14 次。比正常人慢。</p>
    <p>還有一件事：帶子的轉速不對。這是用 2.4 錄的，我這台只有 4.76。<br>
    也就是說，我從頭到尾都是用兩倍速在聽它。</p>

    <img class="scan" src="../assets/img/wave_14.jpg" width="560" height="240" alt="底噪波形">
    <p class="caption">底噪波形（節錄 60 秒）｜一分鐘 14 次｜2005/02/21 01:40</p>

    <p class="sndline">
      <button class="sndbtn" id="breathBtn" type="button">♪ 試聽底噪</button>
      <span class="small gray">（節錄，已放大。建議配戴耳機。）</span>
    </p>
