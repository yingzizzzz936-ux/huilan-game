<script>window.HL_VIEWER="../_v/viewer.html";</script>
<script src="../js/hl-audio.js"></script>
<script>
(function(){
  var btn = document.getElementById("lastBtn");
  var tm  = document.getElementById("lastTime");
  var note= document.getElementById("lastNote");
  if (!btn) return;
  var a = new Audio(HL.url("v04_zhou_last"));
  a.preload = "auto";
  function fmt(t){
    var m = Math.floor(t/60), s = Math.floor(t%60);
    return m + ":" + (s<10?"0":"") + s;
  }
  btn.addEventListener("click", function(){
    if (a.paused) {
      a.volume = 0.85;
      var p = a.play(); if (p && p.catch) p.catch(function(){});
      btn.textContent = "❚❚ 暫停";
    } else {
      a.pause();
      btn.textContent = "▶ 0311_0312.wav";
    }
    note.textContent = "（播放中，請勿調整音量。）";
  });
  a.addEventListener("timeupdate", function(){
    tm.textContent = fmt(a.currentTime) + " / 1:01";
  });
  a.addEventListener("ended", function(){
    btn.textContent = "▶ 0311_0312.wav";
    note.textContent = "（播放結束。第七個數，沒有錄到。）";
  });
})();
</script>
