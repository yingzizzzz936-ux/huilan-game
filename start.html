<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回瀾</title>
<meta property="og:type" content="website">
<meta property="og:title" content="回瀾">
<meta property="og:description" content="一個 2005 年的聲音修復工作室。它已經停止更新很久了，可是它還在。約 60–90 分鐘的單機網頁解謎。">
<meta property="og:image" content="assets/img/og_huilan.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="回瀾：一個 2005 年的聲音修復工作室">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="一個 2005 年的聲音修復工作室。它已經停止更新很久了，可是它還在。">
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0908; color: #cfc6b4;
    font-family: "MingLiU", "PMingLiU", "細明體", "Songti SC", serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 0 24px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 46px; letter-spacing: 18px; font-weight: normal;
    color: #e8dfcb; margin: 0 0 8px 18px;
  }
  .en {
    font-size: 10px; letter-spacing: 9px; color: #5a5248;
    font-family: Arial, Helvetica, sans-serif; margin-bottom: 52px;
  }
  .line {
    font-size: 13px; color: #7d7466; line-height: 2.6;
    text-align: center; margin-bottom: 46px;
  }
  .enter {
    background: none; border: 1px solid #5a4f42; color: #cfc6b4;
    font-family: inherit; font-size: 14px; letter-spacing: 8px;
    padding: 12px 46px; cursor: pointer; transition: background .2s, color .2s;
  }
  .enter:hover { background: #1b1611; color: #fff; border-color: #8fa89b; }
  .warn {
    font-size: 11px; color: #6b6357; line-height: 2.2;
    margin-top: 46px; max-width: 440px; text-align: center;
  }
  .meta {
    position: fixed; left: 0; right: 0; bottom: 18px;
    font-size: 10px; color: #3a332c; font-family: Arial, Helvetica, sans-serif;
    letter-spacing: 1px; text-align: center;
  }
  .fade {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; transition: opacity 1.1s;
  }
  .fade.on { opacity: 1; }

  @media (max-width: 640px) {
    h1 { font-size: 30px; letter-spacing: 10px; }
    .line { font-size: 12px; }
    .warn { margin-top: 30px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>回瀾</h1>
  <div class="en">H U I - L A N</div>

  <div class="line">
    這是一個 2005 年的網站。<br>
    它已經停止更新很久了。<br>
    可是它還在。
  </div>

  <button class="enter" id="go" type="button">進　入</button>

  <div class="warn">
    本作為虛構創作。內容包含心理恐怖、幽閉、死亡與失蹤、宗教儀式描寫。<br>
    建議配戴耳機，並在光線充足的環境遊玩。<br>
    全程沒有驚嚇彈窗。若感到不適，請直接關閉頁面——這不是遊戲的一部分。
  </div>
</div>

<div class="meta">約 60–90 分鐘　·　建議以電腦瀏覽　·　全程可隨時離開</div>
<div class="fade" id="fade"></div>

<script>
document.getElementById("go").addEventListener("click", function () {
  try { localStorage.setItem("hl_seen", "1"); } catch (e) {}
  document.getElementById("fade").classList.add("on");
  setTimeout(function () { location.href = "index.html"; }, 1100);
});
</script>
</body>
</html>
